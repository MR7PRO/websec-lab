<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#081323" />
<title>🎬 قارئ فيديو WebSec Lab</title>
<style>
:root{color-scheme:dark;--bg:#081323;--panel:#122238;--soft:#20344c;--text:#f5f9ff;--muted:#b3c4d5;--aqua:#50ebc6;--pink:#ffb4b0;--spoken:clamp(23px,5.2vw,35px)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#172c49 0,#081323 60%);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;min-height:100svh;line-height:1.55}
header{padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;position:sticky;top:0;z-index:10;background:#081323f0;border-bottom:1px solid #ffffff22;backdrop-filter:blur(15px)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:800px;margin:auto}.brand{font-size:19px;font-weight:850}.badge{padding:4px 10px;border-radius:25px;background:#1c4b46;color:#a8ffdd;font-size:13px;font-weight:700;white-space:nowrap}
.toolbar{max-width:800px;margin:12px auto 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button{padding:10px 12px;border-radius:12px;border:1px solid #426079;background:#18344f;color:var(--text);font-weight:700;min-height:43px}.toolbar button[aria-pressed="true"]{background:var(--aqua);color:#002822;border-color:var(--aqua)}.spacer{flex:1}.size-btn{min-width:42px}progress{appearance:none;-webkit-appearance:none;display:block;width:100%;height:5px;margin:14px 0 0;border:0;border-radius:3px;overflow:hidden;background:#294057}progress::-webkit-progress-bar{background:#294057}progress::-webkit-progress-value{background:var(--aqua)}progress::-moz-progress-bar{background:var(--aqua)}
main{max-width:800px;padding:20px 15px 180px;margin:auto}.scene{border:1px solid #496178;border-radius:23px;background:linear-gradient(160deg,#142945,#102138);overflow:hidden;box-shadow:0 18px 55px #0005}.scene-top{padding:18px 20px 17px;background:#1a3553;border-bottom:1px solid #36546f}.num{font-size:13px;color:#a3bcd0;font-weight:700;letter-spacing:.4px}.title{font-size:clamp(23px,6vw,33px);line-height:1.25;margin:8px 0 7px;font-weight:850}.time{color:var(--aqua);font-size:16px;font-weight:850}.body{padding:22px 19px}.eyebrow{font-size:15px;font-weight:900;letter-spacing:.4px;color:var(--aqua);margin:0 0 10px}.spoken{font-size:var(--spoken);font-weight:650;line-height:1.83;letter-spacing:.0px;white-space:pre-line;margin:0;overflow-wrap:anywhere}.cue{border:1px solid #3c566e;background:#1d324b;border-radius:18px;padding:16px 16px;margin-top:26px}.cue .eyebrow{color:#ffcf8e}.cue p{font-size:18px;line-height:1.7;margin:0;white-space:pre-line}.tip{font-size:14px;line-height:1.6;color:var(--muted);margin:16px 0 0}.meta{margin:19px 3px 0;color:var(--muted);font-size:15px;text-align:center}.microactions{display:flex;gap:9px;justify-content:center;margin:22px 0 0}.microactions button{background:#1d3348;color:#e6f2fb;border:1px solid #44617c;border-radius:12px;padding:10px 15px;font-size:14px;min-height:43px}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px 15px calc(env(safe-area-inset-bottom) + 16px);background:#081323f4;border-top:1px solid #ffffff25;display:flex;gap:12px;justify-content:center;z-index:9}.bottom button{font-size:19px;font-weight:850;border:0;padding:14px 17px;border-radius:15px;min-height:57px}.prev{background:#243951;color:#f8faff;flex:1;max-width:220px}.next{background:var(--aqua);color:#00342d;flex:2;max-width:400px}.bottom button:disabled{opacity:.36}.hidden{display:none!important}
.notice{margin-top:17px;padding:14px 18px;background:#143147;border:1px solid #426071;border-radius:17px;font-size:15px;color:#d0e6ef}.notice strong{color:#90f4da}.finish{text-align:center}.finish h2{font-size:30px}.finish p{font-size:20px;line-height:1.8}
@media(min-width:800px){header{padding-top:15px}main{padding-top:30px}.spoken{max-width:38ch}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
<div class="topline"><div class="brand">🎥 WebSec Lab · قارئ الجوال</div><div id="number" class="badge">1 / 7</div></div>
<div class="toolbar"><button id="full" aria-pressed="true" type="button">🎬 3 دقائق</button><button id="short" aria-pressed="false" type="button">⚡ 90 ثانية</button><span class="spacer"></span><button id="less" class="size-btn" aria-label="تصغير النص">A−</button><button id="more" class="size-btn" aria-label="تكبير النص">A+</button></div>
<progress id="progress" value="1" max="7" aria-label="تقدم العرض"></progress>
</header>
<main>
<section class="scene" aria-live="polite">
<div class="scene-top"><div class="num" id="kicker">المشهد 01</div><h1 class="title" id="title">المقدمة</h1><div class="time" id="time">00:00–00:17</div></div>
<div class="body"><p class="eyebrow">🎙️ احكي بالنص</p><p id="speech" class="spoken"></p><div class="cue"><p class="eyebrow">🖱️ اعمل على الكمبيوتر</p><p id="action"></p></div><p id="tip" class="tip"></p></div>
</section>
<div class="microactions"><button id="copy" type="button">📋 نسخ الكلام</button><button id="startOver" type="button">↺ من البداية</button></div>
<div class="notice"><strong>💡 نصيحة:</strong> خليك فاتح قارئ الجوال على الموبايل، والمشروع على الكمبيوتر. اقرأ جملة، نفّذ الحركة المقابلة، واضغط «المشهد التالي».</div>
<p class="meta">مُعد للاستعراض التعليمي — لا تصور بيانات حقيقية أو إشعارات خاصة.</p>
</main>
<nav class="bottom" aria-label="التنقل بين المشاهد"><button id="prev" class="prev" type="button">→ السابق</button><button id="next" class="next" type="button">التالي ←</button></nav>
<script>
const long=[
{title:'🏠 المقدمة',time:'0:00–0:17',speech:'السلام عليكم أستاذة آلاء. اليوم انقطع عندي الإنترنت أثناء الكويز وتأثرت علامتي، فحبيت أقدّم بدل طلب التعويض وحده شغل عملي يساعد طلاب مادة أمن الويب. سميت المشروع WebSec Lab.',action:'اعرض الصفحة الرئيسية. خَلّي اسم WebSec Lab واضحًا.',tip:'🎤 نبرة هادئة، ولا تطوّل في موضوع العلامة؛ انتقل سريعًا لقيمة المشروع.'},
{title:'🌐 الفكرة التعليمية',time:'0:17–0:32',speech:'الفكرة بسيطة: بدل ما الطالب يحفظ التعريف فقط، يجرّب بنفسه ثلاث مفاهيم أمنية، ومعها اختبار يقيس فهمه. الواجهة عربية وإنجليزية، وممكن تشغيل النسخة الأساسية محليًا من الجهاز.',action:'مرّر على بطاقات المختبرات الثلاث. اضغط زر EN للحظة، ثم ارجع للعربية.',tip:'👀 وقف لحظة عند البطاقات حتى تظهر الأقسام الثلاثة.'},
{title:'🛡️ SQL Injection',time:'0:32–1:13',speech:'هون محاكاة تعليمية آمنة لثغرة SQL Injection؛ ما في أي هجوم على موقع حقيقي. جرّبنا دخولًا عاديًا، والآن نجرب مدخلات حقن وهمية. لاحظي: النموذج غير الآمن يدمج المدخلات مباشرة في الاستعلام فتتغير النتيجة، لكن النموذج المحمي يستخدم Prepared Statements، وبتصير المدخلات مجرد بيانات مش أوامر SQL. هيك الطالب بشوف الثغرة وطريقة منعها جنب بعض.',action:'مختبر SQL Injection ← دخول سليم ← شغّل المقارنة ← محاولة حقن تعليمية ← شغّل المقارنة. ركّز على نتيجتي UNSAFE وPREPARED.',tip:'✅ أهم لحظة في الفيديو. المحاكاة لا تستخدم SQL أو قاعدة بيانات حقيقية.'},
{title:'🔐 التشفير الحقيقي',time:'1:13–1:52',speech:'هون بنطبق تشفير AES حقيقي داخل المتصفح، باستخدام AES-256-GCM. بكتب نصًا تجريبيًا، وبضغط تشفير؛ بيظهر النص المشفر بصيغة Base64. وبالمفتاح الصحيح بقدر أسترجع النص. لكن لما أغيّر كلمة المرور، بتفشل عملية فك التشفير. وبما إن المحاضرة أخذنا فيها AES-256-CBC، أرفقت مثال PHP منفصلًا يستخدم CBC مع حماية إضافية للسلامة.',action:'مختبر التشفير ← تشفير AES الآن ← فك التشفير ← غيّر عبارة المرور إلى WrongPass-2026 ← فك التشفير ثانية.',tip:'⚠️ شغّل الموقع على localhost لتعمل Web Crypto reliably. لا تستخدم أسرارك الحقيقية.'},
{title:'🔑 حماية كلمات المرور',time:'1:52–2:15',speech:'هذا القسم بوضّح الفرق بين التشفير والـHashing. نفس كلمة المرور مع قيم Salt عشوائية مختلفة بتنتج Hashات مختلفة. وتجربة SHA-256 هون للشرح فقط، أما التخزين الفعلي الآمن لكلمات المرور فمثال PHP المرفق يستخدم bcrypt مع password_hash وpassword_verify.',action:'حماية كلمات المرور ← ولّد نتيجتين بملحين مختلفين. أبرز وجود قيمتي Salt وHash مختلفتين.',tip:'💬 لا تقل إن الواجهة تولّد bcrypt؛ bcrypt الفعلي في ملف PHP.'},
{title:'🧠 الاختبار',time:'2:15–2:34',speech:'وفي النهاية طورت بنك الأسئلة إلى ستين سؤالًا بالعربي والإنجليزي موزّعة على ستة موضوعات. الطالب بختار الموضوع وعدد الأسئلة: خمسة أو عشرة أو عشرين أو كل الأسئلة. كل إجابة إلها تفسير، وبالنهاية بتنحفظ النتيجة محليًا بدون حساب.',action:'اختبر معرفتك ← اختَر موضوع SQL Injection ← حدّد 5 أسئلة ← ابدأ الآن ← أظهر تفسير إجابة أول سؤال.',tip:'⏩ الأسئلة عشوائية؛ لا تحفظ إجابة مسبقة، اقرأ السؤال وقرر.'},
{title:'🎓 الخاتمة والطلب',time:'2:34–2:53',speech:'هدفي من WebSec Lab يكون أداة مساعدة لزملائي، خصوصًا مع مشاكل الاتصال اللي بنواجهها. أرفقت الكود والتقرير والمختبرات العملية، وبتمنى من حضرتك النظر في إمكانية احتسابه كبونص تعويضي عن المشكلة اللي صارت معي في الكويز. شكرًا إلك.',action:'ارجع للصفحة الرئيسية أو «عن المشروع»، وخَلّي اسم المشروع ظاهرًا أثناء الإغلاق.',tip:'🙏 اختم بثقة وهدوء. البونص قرار المعيدة، وليس أمرًا مضمونًا.'}
];
const short=[
{title:'🏠 المقدمة',time:'0:00–0:14',speech:'السلام عليكم أستاذة آلاء. انقطع عندي النت أثناء الكويز، وحبيت أقدّم عملًا إضافيًا يفيد طلاب المادة بدل الاكتفاء بطلب تعويض. هذا WebSec Lab.',action:'اعرض الصفحة الرئيسية.',tip:'⏱️ اختصر المقدمة قدر الإمكان.'},
{title:'🛡️ مختبر SQL Injection',time:'0:14–0:43',speech:'هون محاكاة تعليمية بتقارن بين استعلام غير آمن بيدمج مدخلات المستخدم، واستعلام محمي بـPrepared Statements. نفس المدخل بيوضح ليش الطريقة الأولى معرضة للحقن والثانية بتتعامل معه كنص فقط.',action:'مختبر SQL Injection ← محاولة حقن تعليمية ← شغّل المقارنة.',tip:'✨ ركز على المقارنة بين UNSAFE وPREPARED.'},
{title:'🔐 تشفير AES',time:'0:43–1:05',speech:'هون تشفير AES-256-GCM حقيقي داخل المتصفح. بشفر رسالة وهمية وبرجعها بكلمة المرور الصحيحة. وفي نسخة PHP مرفقة للـAES-256-CBC الموجود بالمحاضرة.',action:'مختبر التشفير ← تشفير AES الآن ← فك التشفير.',tip:'✅ استخدم localhost إن تعطلت Web Crypto عند فتح الملف مباشرة.'},
{title:'🔑 Hash وQuiz',time:'1:05–1:18',speech:'وفي شرح عملي للـSalt والفرق بين الـHash والتشفير، مع ملف bcrypt حقيقي في PHP وبنك أسئلة من ستين سؤالًا بموضوعات ومستويات تدريب مرنة وتصحيح فوري.',action:'حماية كلمات المرور ← ولّد نتيجتين بملحين مختلفين ← اختبر معرفتك.',tip:'📌 SHA-256 هنا للتوضيح فقط، وليس لتخزين كلمات مرور حقيقية.'},
{title:'🎓 الخاتمة',time:'1:18–1:30',speech:'كل ملفات المشروع والتقرير مرفقة، وهو مصمم ليساعد زملائي حتى مع ضعف الإنترنت. بتمنى تنظروا في احتسابه كبونص تعويضي، وشكرًا لحضرتك.',action:'ارجع للصفحة الرئيسية، وأوقف التسجيل بعد الشكر.',tip:'💚 اختم بابتسامة في الصوت.'}
];
let current=0,mode='long',size=26;try{size=Number(localStorage.getItem('websec-prompter-size')||26)}catch(_e){}if(!(size>=21&&size<=42))size=26;function saveSize(){try{localStorage.setItem('websec-prompter-size',size)}catch(_e){}}
const $=id=>document.getElementById(id);function scenes(){return mode==='long'?long:short}
function render(){const arr=scenes(),d=arr[current];$('number').textContent=(current+1)+' / '+arr.length;$('kicker').textContent='المشهد '+String(current+1).padStart(2,'0');$('title').textContent=d.title;$('time').textContent='⏱️ '+d.time;$('speech').textContent=d.speech;$('action').textContent=d.action;$('tip').textContent=d.tip;$('prev').disabled=current===0;$('next').textContent=current===arr.length-1?'✅ النهاية':'التالي ←';$('progress').max=arr.length;$('progress').value=current+1;document.documentElement.style.setProperty('--spoken',size+'px');$('full').setAttribute('aria-pressed',mode==='long'?'true':'false');$('short').setAttribute('aria-pressed',mode==='short'?'true':'false');window.scrollTo({top:0,behavior:'instant'});}
$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(current<scenes().length-1){current++;render()}else{current=0;render()}};$('full').onclick=()=>{mode='long';current=0;render()};$('short').onclick=()=>{mode='short';current=0;render()};$('less').onclick=()=>{size=Math.max(21,size-2);saveSize();render()};$('more').onclick=()=>{size=Math.min(42,size+2);saveSize();render()};$('startOver').onclick=()=>{current=0;render()};
$('copy').onclick=async()=>{const t=$('speech').textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()};$('copy').textContent='✅ نُسخ';setTimeout(()=>{$('copy').textContent='📋 نسخ الكلام'},1600)}catch(e){$('copy').textContent='تعذر النسخ'}};
render();
</script>
</body>
</html>
